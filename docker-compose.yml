services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdeskflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: helpdeskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpdeskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: helpdeskflow-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@postgres:5432/helpdeskflow
      LLM_PROVIDER: mock
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: helpdeskflow-web
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
